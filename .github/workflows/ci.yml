name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.113"
      - run: dotnet build Dw3.sln --nologo
      # Whitespace and IDE style rules. Every analyzer diagnostic already fails the build above.
      - if: runner.os == 'Linux'
        run: |
          dotnet format whitespace Dw3.sln --verify-no-changes
          dotnet format style Dw3.sln --verify-no-changes --no-restore
      - if: runner.os == 'Linux'
        run: dotnet test Dw3.sln --nologo --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/quality/coverage
      - if: runner.os != 'Linux'
        run: dotnet test Dw3.sln --nologo --no-build
      - name: Coverage minimum (80 % of lines in Dw3.Data, Dw3.Disc, Dw3.Formats, Dw3.Extractor)
        if: runner.os == 'Linux'
        run: dotnet run --project tools/Dw3.QualityRatchet --no-build -- check
      - name: Upload quality reports
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            artifacts/quality/sarif
            artifacts/quality/coverage.cobertura.xml
          if-no-files-found: ignore
