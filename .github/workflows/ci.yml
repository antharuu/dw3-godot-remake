name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # Windows Defender real-time scanning holds file handles on newly created SQLite
      # databases in TEMP, causing Directory.Move (staging -> active) to fail with
      # "Access to the path is denied". Excluding TEMP removes the interference.
      - name: Exclude TEMP from Windows Defender scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:TEMP"
      - run: dotnet build Dw3.sln --nologo
      - run: dotnet test Dw3.sln --nologo
