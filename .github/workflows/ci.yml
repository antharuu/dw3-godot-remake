name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.113"
      - run: dotnet build Dw3.sln --nologo
      - if: runner.os == 'Linux'
        run: dotnet format Dw3.sln --verify-no-changes --no-restore
      - run: dotnet test Dw3.sln --nologo
